<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A2C"/>
      <stop offset="0.52" stop-color="#0A2A3F"/>
      <stop offset="1" stop-color="#040C15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.43" r="0.62">
      <stop offset="0" stop-color="#1DE7CF" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#138FA8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07131F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#FFF5BF"/>
      <stop offset="0.32" stop-color="#FFD166"/>
      <stop offset="0.7" stop-color="#FFA51F"/>
      <stop offset="1" stop-color="#E87508"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
