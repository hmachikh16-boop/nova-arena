<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="حدائق نوفا">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
